<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Playground</title>
  <meta name="theme-color" content="#1f1f1f" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page-dark" data-page="playground">
  <main class="stage-wrap">
    <header class="topbar">
      <button class="dock-back" type="button" data-nav="surprise.html">Back</button>
      <span class="caption">Playground · nothing here counts</span>
    </header>
    <div class="stage" id="stage" aria-label="Animation stage"></div>

    <div class="dock" role="toolbar" aria-label="Controls">
      <div class="dock-actions">
        <button class="btn action-btn" type="button" data-action="throw" data-label="Throw" aria-label="Throw">Click!</button>
        <button class="btn action-btn" type="button" data-action="bite" data-label="Bite" aria-label="Bite">Click!</button>
        <button class="btn action-btn" type="button" data-action="explode" data-label="Explode" aria-label="Explode">Click!</button>
        <button class="btn action-btn" type="button" data-action="love" data-label="Cuddle" aria-label="Cuddle">Click!</button>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
