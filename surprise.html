<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Plush</title>
  <meta name="theme-color" content="#1f1f1f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page-dark" data-page="pet">
  <main class="stage-wrap">
    <header class="topbar">
      <button class="dock-back" type="button" data-nav="index.html">Back</button>
      <div class="topbar-right">
        <span id="presence" class="pill" hidden></span>
        <span id="conn" class="pill" hidden></span>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" aria-haspopup="dialog">≡</button>
      </div>
    </header>

    <div class="stage" id="stage" aria-label="Plush">
      <section class="hud" id="hud" aria-live="polite" aria-label="How Plush is doing"></section>
      <div id="overlay" class="overlay" hidden></div>
    </div>

    <div class="dock pet" role="toolbar" aria-label="Actions">
      <div class="dock-actions" id="dock"></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
