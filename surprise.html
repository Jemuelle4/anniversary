<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surprise</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page-dark">
  <main class="stage-wrap">
    <div class="stage" id="stage" aria-label="Animation stage"></div>

    <div class="dock" role="toolbar" aria-label="Controls">
      <button class="dock-back" type="button" data-nav="index.html">Back</button>

      <div class="dock-actions">
        <button class="btn action-btn" type="button" data-action="throw" data-label="Throw">Click!</button>
        <button class="btn action-btn" type="button" data-action="bite" data-label="Bite">Click!</button>
        <button class="btn action-btn" type="button" data-action="explode" data-label="Explode">Click!</button>
        <button class="btn action-btn" type="button" data-action="love" data-label="Cuddle">Click!</button>
      </div>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
